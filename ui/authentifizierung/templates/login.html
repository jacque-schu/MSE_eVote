<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eVote Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static_authentifizierung', path='auth.css') }}">
    <link rel="stylesheet" href="{{ url_for('static_common', path='base.css') }}">
</head>
<body>
<div class="login-shell">
    <div class="login-card">
        <h1>eVote Login</h1>
        <p class="subtitle">Wählen Sie Ihre Rolle für den Login:</p>

        <div class="role-tabs">
            <button class="tab-login active-login" data-role="admin" onclick="setRole('admin')">🛡️ Admin</button>
            <button class="tab-login" data-role="buerger" onclick="setRole('buerger')">👤 Bürger</button>
        </div>

        <div id="role-indicator" class="role-indicator" style="display:none;">
            Aktiver Modus: <strong id="current-role">Admin</strong>
        </div>

        <form id="loginform">
            <div id="admin-fields">
                <div class="form-group">
                    <label class="form-label">Benutzername</label>
                    <input type="text" id="admin-username" class="form-input" placeholder="admin">
                </div>
                <div class="form-group">
                    <label class="form-label">Passwort</label>
                    <input type="password" id="admin-password" class="form-input" placeholder="admin123">
                </div>
            </div>

            <div id="buerger-fields" style="display:none;">
                <div class="form-group">
                    <label class="form-label">E-Mail</label>
                    <input type="email" id="buerger-email" class="form-input" placeholder="max@example.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Passwort</label>
                    <input type="password" id="buerger-password" class="form-input" placeholder="Passwort">
                </div>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">Einloggen</button>
        </form>

        <div id="error" class="error"></div>
    </div>
</div>

<script>
let currentRole = 'admin';

function updateRequiredAttributes() {
    document.querySelectorAll('#admin-fields input, #buerger-fields input')
        .forEach(input => {
            if (input.offsetParent === null) input.removeAttribute('required');
            else input.setAttribute('required', '');
        });
}

function setRole(role) {
    currentRole = role;
    document.querySelectorAll('.tab-login').forEach(btn => btn.classList.toggle('active-login', btn.dataset.role === role));
    document.getElementById('admin-fields').style.display = role === 'admin' ? 'block' : 'none';
    document.getElementById('buerger-fields').style.display = role === 'buerger' ? 'block' : 'none';

    const indicator = document.getElementById('role-indicator');
    const roleText = document.getElementById('current-role');
    indicator.style.display = 'block';
    roleText.textContent = role === 'admin' ? 'Admin' : 'Bürger';

    document.querySelectorAll('input').forEach(input => input.value = '');
    updateRequiredAttributes();
}

document.addEventListener("DOMContentLoaded", function () {
    updateRequiredAttributes();

    const form = document.getElementById('loginform');
    const errorDiv = document.getElementById('error');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async function (e) {
        e.preventDefault();
        errorDiv.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Einloggen...';

        const formData = new FormData();
        let endpoint = '';
        if (currentRole === 'admin') {
            formData.append('username', document.getElementById('admin-username').value.trim());
            formData.append('password', document.getElementById('admin-password').value);
            endpoint = '/api/auth/buergerverwaltung/admin';
        } else {
            formData.append('email', document.getElementById('buerger-email').value.trim());
            formData.append('password', document.getElementById('buerger-password').value);
            endpoint = '/api/auth/buergerverwaltung/buerger';
        }

        try {
            // ✅ credentials: 'include' sorgt dafür, dass Cookies auch an das Backend geschickt werden
            const response = await fetch(endpoint, { method: 'POST', body: formData, credentials: 'include' });
            const text = await response.text();

            if (!response.ok) {
                let data;
                try { data = JSON.parse(text); } catch (_) { data = { detail: text }; }
                showError(data.detail || 'Login fehlgeschlagen');
                return;
            }

            const data = JSON.parse(text);
            if (!data.access_token) {
                showError('Token fehlt im Response');
                return;
            }

            // ✅ Cookie setzen für Backend
            // Lokal / HTTP
            document.cookie = `auth_token=${data.access_token}; path=/; max-age=3600`;


            // Optional: lokal speichern für JS-Checks
            localStorage.setItem('access_token', data.access_token);
            localStorage.setItem('user_role', currentRole);

            window.location.href = '/ui/startseite';

        } catch (err) {
            showError('Netzwerkfehler: ' + err.message);
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Einloggen';
        }
    });

    function showError(message) {
        errorDiv.textContent = message;
        errorDiv.style.display = 'block';
    }
});
</script>
</body>
</html>
