<!-- Basis-Layout für die eVote-Webanwendung, Template für die U -->

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}eVote{% endblock %}</title>

  <link rel="stylesheet" href="{{ url_for('static_common', path='base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static_abstimmung', path='abstimmung.css') }}">
</head>
<body>

  {% include "partials/navbar.html" %}

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const role = localStorage.getItem('user_role');
    document.querySelectorAll('.js-admin-only').forEach(el => {
      el.classList.toggle('is-hidden', role !== 'admin');
    });
  });
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>
