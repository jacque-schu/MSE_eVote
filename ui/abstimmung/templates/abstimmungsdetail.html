<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>{{ abstimmung.titel }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f3f4f6;
            padding: 2rem;
        }
        .page {
            max-width: 700px;
            margin: 0 auto;
            background: #ffffff;
            padding: 2rem 2.5rem;
            border-radius: 14px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.06);
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: #111827;
        }
        .subtitle {
            color: #6b7280;
            margin-bottom: 1.5rem;
        }
        .meta {
            display: flex;
            gap: 1rem;
            font-size: 0.9rem;
            color: #6b7280;
            margin-bottom: 1.5rem;
        }
        .meta span {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }
        .error {
            margin-bottom: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            font-size: 0.9rem;
        }
        .buttons {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.75rem;
        }
        .vote-btn {
            flex: 1;
            padding: 0.85rem 1rem;
            border-radius: 999px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            color: #ffffff;
            transition: transform 0.05s, box-shadow 0.1s, filter 0.1s;
        }
        .vote-ja   { background: linear-gradient(135deg, #10b981, #059669); }
        .vote-nein { background: linear-gradient(135deg, #ef4444, #b91c1c); }
        .vote-ent  { background: linear-gradient(135deg, #6b7280, #4b5563); }
        .vote-btn:hover {
            filter: brightness(1.05);
            box-shadow: 0 8px 18px rgba(0,0,0,0.12);
            transform: translateY(-1px);
        }
        .footer-actions {
            margin-top: 1.5rem;
            display: flex;
            gap: 0.75rem;
        }
        .nav-btn {
            border-radius: 999px;
            border: 1px solid #d1d5db;
            padding: 0.6rem 1.2rem;
            background: #f9fafb;
            color: #4b5563;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .nav-btn:hover {
            background: #e5e7eb;
        }
    </style>
</head>
<body>
<div class="page">
    <h1>{{ abstimmung.titel }}</h1>
    <p class="subtitle">{{ abstimmung.beschreibung }}</p>

    <div class="meta">
        <span>🗳️ <strong>{{ abstimmung.stimmen | length }}</strong> abgegebene Stimmen</span>
        <span>📅 Von {{ abstimmung.startDatum }} bis {{ abstimmung.endDatum }}</span>
    </div>

    {% if fehlermeldung %}
      <div class="error">{{ fehlermeldung }}</div>
    {% endif %}

    <form method="post" action="/abstimmungen/{{ abstimmung.abstimmungsID }}/stimme">
        <div class="buttons">
            <button type="submit" name="wahl" value="JA" class="vote-btn vote-ja">
                Ja
            </button>
            <button type="submit" name="wahl" value="NEIN" class="vote-btn vote-nein">
                Nein
            </button>
            <button type="submit" name="wahl" value="ENTHALTUNG" class="vote-btn vote-ent">
                Enthaltung
            </button>
        </div>
    </form>

    <div class="footer-actions">
        <a class="nav-btn" href="/startseite">Startseite</a>
        <a class="nav-btn" href="/ui/abstimmungsuebersicht">Abstimmungsübersicht</a>
    </div>
</div>
</body>
</html>
