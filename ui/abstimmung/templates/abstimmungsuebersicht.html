<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Abstimmungsübersicht</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 2rem;
        }
        .page {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        h1 {
            margin-top: 0;
            margin-bottom: 1rem;
        }
        p.subtitle {
            color: #6b7280;
            margin-bottom: 2rem;
        }
        .topic-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .topic-button {
            width: 100%;
            padding: 0.85rem 1rem;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            background: #e5e7eb;
            color: #4b5563;
            text-align: left;
            cursor: default; /* „tot“ – nicht klickbar */
            font-size: 1rem;
        }
        .topic-button span.label {
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="page">
        <h1>Abstimmungsübersicht</h1>
        <p class="subtitle">
            Hier sehen Sie eine Übersicht über aktuelle Abstimmungsthemen.
        </p>

        <div class="topic-list">
            <button class="topic-button" type="button">
                <span class="label">Thema 1:</span> Haushaltsplan 2026
            </button>
            <button class="topic-button" type="button">
                <span class="label">Thema 2:</span> Ausbau Radwegenetz
            </button>
            <button class="topic-button" type="button">
                <span class="label">Thema 3:</span> Schulmodernisierung
            </button>
            <button class="topic-button" type="button">
                <span class="label">Thema 4:</span> Öffentlicher Nahverkehr
            </button>
            <button class="topic-button" type="button">
                <span class="label">Thema 5:</span> Umwelt- und Klimaschutz
            </button>
        </div>
    </div>
</body>
</html>
