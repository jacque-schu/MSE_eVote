<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Bürger registrieren</title>

    <!-- Falls du auf der Startseite schon Inter verwendest, kannst du das hier wiederverwenden -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Globale Styles + Registrierungs-Styles -->
    <link rel="stylesheet" href="{{ url_for('static', path='base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='registration.css') }}">
</head>
<body>

<div class="registration-shell">
    <div class="registration-card">
        <h1>Bürger registrieren</h1>
        <p class="subtitle">
            Erfassen Sie die Daten der Bürgerin oder des Bürgers für das eVote-System.
        </p>

        <!-- WICHTIG: Action, Method & Feldnamen wie zuvor -->
        <form class="registration-form" action="/registrierung/formular" method="POST">

            <!-- Hidden: Bürger-ID wie gehabt -->
            <input type="hidden" name="buergerID" value="1">

            <!-- Vor- & Nachname nebeneinander -->
            <div class="form-group-inline">
                <div class="form-group">
                    <label class="form-label" for="vorname">Vorname</label>
                    <input
                        type="text"
                        id="vorname"
                        name="vorname"
                        class="form-input"
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="nachname">Nachname</label>
                    <input
                        type="text"
                        id="nachname"
                        name="nachname"
                        class="form-input"
                        required
                    >
                </div>
            </div>

            <!-- Adresse -->
            <div class="form-group">
                <label class="form-label" for="adresse">Adresse</label>
                <input
                    type="text"
                    id="adresse"
                    name="adresse"
                    class="form-input"
                    placeholder="Beispielstraße 12"
                    required
                >
            </div>

            <!-- Geburtsdatum & Auth-Status nebeneinander -->
            <div class="form-group-inline">
                <div class="form-group">
                    <label class="form-label" for="geburtsdatum">Geburtsdatum</label>
                    <input
                        type="date"
                        id="geburtsdatum"
                        name="geburtsdatum"
                        class="form-input"
                        value="1990-01-01"
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="authentifizierungsdaten">Authentifizierungsstatus</label>
                    <select
                        id="authentifizierungsdaten"
                        name="authentifizigungsdaten"
                        class="form-select"
                        required
                    >
                        <option value="offen" selected>Offen</option>
                        <option value="bestätigt">Bestätigt</option>
                    </select>
                </div>
            </div>

            <!-- E-Mail -->
            <div class="form-group">
                <label class="form-label" for="email">E-Mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-input"
                    placeholder="max@example.com"
                    required
                >
            </div>

            <!-- Submit -->
            <div class="form-actions">
                <button type="submit" class="btn-primary">Registrieren</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
