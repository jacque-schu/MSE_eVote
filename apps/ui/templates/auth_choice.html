<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>eVote – Willkommen</title>

    <!-- gleiche Fonts/Styles wie auf der Startseite -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', path='base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='registration.css') }}">
</head>
<body>

<div class="registration-shell">
    <div class="registration-card">
        <h1>Willkommen bei eVote</h1>
        <p class="subtitle">
            Bitte registrieren Sie sich oder melden Sie sich an,
            um das eVote-System zu nutzen.
        </p>

        <div class="form-actions" style="justify-content: stretch; gap: 10px;">
            <a href="/registrierung"
               class="btn-primary"
               style="flex: 1; text-align: center;">
                Registrieren
            </a>

            <a href="/login"
               class="btn-secondary"
               style="flex: 1; text-align: center;">
                Anmelden
            </a>
        </div>

        <p class="subtitle" style="margin-top: 10px;">
            Sie können eVote auch zunächst nur ansehen, ohne sich anzumelden.
            <a href="/startseite" style="color: var(--accent); text-decoration: underline;">
                Startseite ansehen (Demo)
            </a>
        </p>
    </div>
</div>

</body>
</html>
