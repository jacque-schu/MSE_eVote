<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Anmeldung – eVote</title>

    <!-- Gleiche Fonts wie auf den anderen Seiten -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Globale Styles + Formular-Styles -->
<link rel="stylesheet" href="{{ url_for('static_common', path='base.css') }}">
<link rel="stylesheet" href="{{ url_for('static_buergerverwaltung', path='buerger.css') }}">

</head>
<body>

<div class="registration-shell">
    <div class="registration-card">
        <!-- Optional: Zurück-Link -->
        <a href="/auth" class="back-link">
            ← Zurück zur Auswahl
        </a>

        <h1>Anmeldung</h1>
        <p class="subtitle">
            Melden Sie sich mit Ihrer E-Mail-Adresse und Ihrem Passwort am eVote-System an.
        </p>

        <!-- Login-Formular -->
        <form class="registration-form" action="/login" method="POST">
            <!-- E-Mail -->
            <div class="form-group">
                <label class="form-label" for="email">E-Mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-input"
                    placeholder="max@example.com"
                    required
                >
            </div>

            <!-- Passwort -->
            <div class="form-group">
                <label class="form-label" for="password">Passwort</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-input"
                    placeholder="••••••••"
                    required
                >
            </div>

            <!-- Aktionen -->
            <div class="form-actions" style="justify-content: space-between; align-items: center; gap: 12px;">
                <a href="/registrierung" class="btn-secondary">
                    Noch keinen Zugang? Registrieren
                </a>

                <button type="submit" class="btn-primary">
                    Anmelden
                </button>
            </div>

            <p class="subtitle" style="margin-top: 10px;">
                Nur mal schauen?
                <a href="/startseite" style="color: var(--accent); text-decoration: underline;">
                    Zur Startseite als Gast
                </a>
            </p>
        </form>
    </div>
</div>

</body>
</html>
