# Dieser GitHub Actions Workflow automatisiert das Bauen, Testen und Linting (Codeprüfung) einer Python-Anwendung.
# Er wird ausgeführt, wenn auf den main-Branch gepusht oder ein Pull Request erstellt wird.

name: Python application  # Der Name des Workflows (wird in GitHub angezeigt)

on:                       # Hier wird festgelegt, wann der Workflow ausgeführt wird
  push:                   # → bei jedem Push ...
    branches: [ "main" ]  # ... auf den main-Branch
  pull_request:            # → und bei jedem Pull Request ...
    branches: [ "main" ]  # ... der den main-Branch betrifft

permissions:              # Standard-Berechtigungen des Workflows
  contents: read          # Der Workflow darf Repository-Inhalte lesen (z. B. Quellcode auschecken)

jobs:                     # Ein Workflow besteht aus einem oder mehreren "Jobs"
  build:                  # Der Name dieses Jobs ist "build"

    runs-on: ubuntu-latest  # Der Job läuft auf der neuesten Ubuntu-Version (virtuelle GitHub-Umgebung)

    steps:                  # Schritte, die nacheinander ausgeführt werden
    - uses: actions/checkout@v4
      # Schritt 1: Checkt den Code aus dem Repository aus, damit er in der Pipeline verfügbar ist.

    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
      # Schritt 2: Installiert die gewünschte Python-Version (hier 3.10) in der Umgebung.

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      # Schritt 3: Installiert Abhängigkeiten.
      #  - Zuerst wird pip aktualisiert.
      #  - Dann werden flake8 (zum Linting) und pytest (zum Testen) installiert.
      #  - Falls eine requirements.txt-Datei vorhanden ist, werden die dort aufgelisteten Pakete installiert.

    - name: Lint with flake8
      run: |
        # Bricht den Build ab, falls es Syntaxfehler oder undefinierte Namen gibt
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Führt eine zweite flake8-Prüfung aus, die alle Fehler als Warnungen behandelt
        # (exit-zero sorgt dafür, dass der Build nicht fehlschlägt)
        # Dabei werden maximale Komplexität und Zeilenlänge begrenzt.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      # Schritt 4: Führt eine Code-Qualitätsprüfung mit flake8 durch.

    - name: Test with pytest
      run: |
        pytest
      # Schritt 5: Führt alle Tests mit pytest aus.
      # pytest sucht automatisch nach Dateien, die mit "test_" beginnen,
      # und führt sie aus, um sicherzustellen, dass der Code korrekt funktioniert.
