name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo tree (debug)
        run: |
          pwd
          ls -la
          echo "---- requirements.txt ----"
          test -f requirements.txt && cat requirements.txt || echo "requirements.txt NOT FOUND"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Optional: Cache (kannst du vorübergehend auskommentieren, falls verdächtig)
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Installiere aus requirements.txt (falls vorhanden)
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          # Sicherheitshalber httpx nachinstallieren (falls requirements.txt veraltet war)
          python -m pip install httpx
          # Test-/Lint-Tools
          python -m pip install pytest ruff pytest-cov

      - name: Show installed packages (debug)
        run: |
          python -m pip show fastapi || true
          python -m pip show httpx || true
          python -m pip list

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest -q --maxfail=1 --disable-warnings --cov=./ --cov-report=xml

      - name: Upload coverage (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
