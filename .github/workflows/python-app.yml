name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Vollständiger Checkout für SonarCloud

    - name: Set up Python
      uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
      with:
        python-version: "3.10"

    - name: Add repo to PYTHONPATH
      run: echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV

    - name: Set test environment variables
      run: |
        echo "TESTING=1" >> $GITHUB_ENV
        echo "BUERGER_DB_PATH=/tmp/test_buerger_db.json" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        else
          python -m pip install fastapi "uvicorn[standard]" jinja2 httpx
          python -m pip install "pydantic[email]" email-validator
          python -m pip install pytest ruff pytest-cov
        fi

    - name: Lint (ruff)
      run: ruff check . --fix
      continue-on-error: true

    - name: Ensure static dirs exist
      run: mkdir -p apps/static

    - name: Create test database
      run: |
        mkdir -p /tmp
        cat > /tmp/test_buerger_db.json << 'EOF'
        [
          {
            "buergerID": 1,
            "name": "Test User",
            "adresse": "Teststraße 1",
            "geburtsdatum": "1990-01-01",
            "email": "test@example.com",
            "authentifizierungsdaten": "geheim"
          }
        ]
        EOF
        echo "✓ Test database created"
        ls -la /tmp/test_buerger_db.json
        cat /tmp/test_buerger_db.json

    - name: Debug environment
      run: |
        echo "=== Environment Variables ==="
        echo "PYTHONPATH=$PYTHONPATH"
        echo "TESTING=$TESTING"
        echo "BUERGER_DB_PATH=$BUERGER_DB_PATH"
        echo ""
        echo "=== Test Database Status ==="
        ls -la /tmp/test_buerger_db.json || echo "❌ Test DB not found"
        echo ""
        echo "=== Python Environment ==="
        python --version
        pip list
        echo ""
        echo "=== Project Structure ==="
        ls -la
        ls -la apps/ || echo "apps/ directory not found"
        ls -la tests/ || echo "tests/ directory not found"

    - name: Check test collection
      run: |
        echo "=== Attempting to collect tests ==="
        python -m pytest --collect-only -vv
      continue-on-error: true

    - name: Run tests with coverage
      run: |
        python -m pytest -v \
          --capture=no \
          --disable-warnings \
          --cov=apps \
          --cov-report=xml \
          --cov-report=term \
          --tb=long \
          -vv

    - name: Upload coverage artifact
      if: success()
      uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
      with:
        name: coverage
        path: coverage.xml

    - name: SonarCloud Scan
      if: always()
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
