name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Wichtig für SonarCloud

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Add repo to PYTHONPATH
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV
        
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            python -m pip install fastapi "uvicorn[standard]" jinja2 httpx
            python -m pip install "pydantic[email]" email-validator
            python -m pip install pytest ruff pytest-cov
          fi

      - name: Lint (ruff)
        run: ruff check . --fix
        continue-on-error: true  # Linting sollte Build nicht stoppen

      - name: Ensure static dirs exist
        run: |
          mkdir -p apps/static

      - name: Run tests with coverage
        run: |
          python -m pytest -v \
            --capture=no \
            --disable-warnings \
            --cov=apps \
            --cov-report=xml \
            --cov-report=term \
            --tb=short

      - name: Verify coverage.xml
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            echo "✓ coverage.xml exists ($(wc -l < coverage.xml) lines)"
            ls -lh coverage.xml
          else
            echo "✗ coverage.xml NOT found"
            exit 1
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=jacque-schu
            -Dsonar.projectKey=jacque-schu_MSE_eVote
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.sources=apps/
            -Dsonar.tests=tests/
            -Dsonar.test.exclusions=tests/**
