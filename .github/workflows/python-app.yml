name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo tree (debug)
        run: |
          pwd
          ls -la
          echo "---- .github/workflows ----"
          ls -la .github/workflows || true
          echo "---- requirements.txt ----"
          test -f requirements.txt && cat requirements.txt || echo "requirements.txt NOT FOUND"
          echo "---- MSE_eVote (falls vorhanden) ----"
          ls -la MSE_eVote || true

      - name: Set up Python
        uses: actions/setup-python@v5
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Add repo (und Unterordner) to PYTHONPATH
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/MSE_eVote" >> $GITHUB_ENV

        
      - name: Install dependencies (requirements.txt wenn vorhanden)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            python -m pip install fastapi "uvicorn[standard]" jinja2 httpx
            python -m pip install "pydantic[email]" email-validator
            python -m pip install pytest ruff pytest-cov
          fi

      - name: Verify installed packages
        run: |
          python - <<'PY'
          import sys, pkgutil
          print("Python:", sys.version)
          for m in ["fastapi","starlette","uvicorn","httpx","jinja2","pytest","pydantic","email_validator"]:
              print(f"{m:16} installed:", bool(pkgutil.find_loader(m)))
          PY

      - name: Lint (ruff fix)
        run: ruff check . --fix

      - name: Lint (ruff)
        run: ruff check .

      - name: Ensure static dirs exist
        run: |
          mkdir -p apps/static
          mkdir -p MSE_eVote/apps/static

      - name: Run tests with coverage
        run: pytest -vv --maxfail=1 --disable-warnings --cov=apps --cov-report=xml --capture=no

        name: Check if coverage.xml exists
        run: ls -la coverage.xml || ls -la ./ || ls -la ./apps/

      - name: Check coverage.xml presence
        run: |
          if [ -f coverage.xml ]; then
            echo "coverage.xml found."
          else
            echo "coverage.xml NOT FOUND!"
            ls -la
          fi

      - name: Upload coverage (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
        continue-on-error: true

      - name: Run tests with coverage
      run: pytest -q --maxfail=1 --disable-warnings --cov=apps --cov-report=xml --capture=no

