name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Debug: zeigt Verzeichnisbaum & requirements-Inhalt
      - name: Show repo tree (debug)
        run: |
          pwd
          ls -la
          echo "---- .github/workflows ----"
          ls -la .github/workflows || true
          echo "---- requirements.txt ----"
          test -f requirements.txt && cat requirements.txt || echo "requirements.txt NOT FOUND"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # HARTE GARANTIE: Runtime- und Test-Dependencies IMMER installieren
      - name: Install runtime + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi "uvicorn[standard]" jinja2 httpx
          python -m pip install pytest ruff pytest-cov

      # Debug: verifiziere, dass die Pakete wirklich da sind
      - name: Verify installed packages
        run: |
          python - <<'PY'
          import sys, pkgutil
          print("Python:", sys.version)
          for m in ["fastapi","starlette","uvicorn","httpx","jinja2","pytest"]:
              print(f"{m:10} installed:", bool(pkgutil.find_loader(m)))
          PY
          python -m pip list

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest -q --maxfail=1 --disable-warnings --cov=./ --cov-report=xml

      - name: Upload coverage (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
